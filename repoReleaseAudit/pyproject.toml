[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-release-audit"
version = "0.1.0"
description = "Preflight checks for publishing a Git worktree"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
repo-release-audit = "repo_release_audit:main"

[tool.setuptools]
py-modules = ["repo_release_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
