[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-audit"
version = "0.1.0"
description = "Privacy-first activity summaries for Codex session archives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
codex-session-audit = "codex_session_audit:main"

[tool.setuptools]
py-modules = ["codex_session_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
